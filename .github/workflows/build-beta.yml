name: Compilar PermadeathCoreRebirth Beta 1.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar plugin Beta 1.0
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar con Maven
        working-directory: Permadeath-master
        run: mvn -B -pl main -am clean package -DskipTests

      - name: Preparar JAR Beta 1.0
        shell: bash
        run: |
          set -e
          mkdir -p dist
          JAR=$(find Permadeath-master/main/target -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' ! -name '*original*.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" dist/PermadeathCoreRebirth-Beta-1.0.jar
          ls -lh dist/PermadeathCoreRebirth-Beta-1.0.jar

      - name: Publicar JAR Beta 1.0
        uses: actions/upload-artifact@v4
        with:
          name: PermadeathCoreRebirth-Beta-1.0
          path: dist/PermadeathCoreRebirth-Beta-1.0.jar
          if-no-files-found: error
