name: Compilar PermadeathCoreRebirth

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar con Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar proyecto
        shell: bash
        run: |
          set -e
          echo "=== ESTRUCTURA DEL REPOSITORIO ==="
          find . -maxdepth 4 -type f -not -path './.git/*' | sort

          if [ ! -f "Permadeath-master/pom.xml" ]; then
            echo "::error::No se encontró Permadeath-master/pom.xml"
            exit 1
          fi

          echo "Proyecto Maven detectado en Permadeath-master"

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Permadeath-master/pom.xml

      - name: Mostrar versiones
        shell: bash
        run: |
          java -version
          mvn -version

      - name: Compilar proyecto
        working-directory: Permadeath-master
        run: mvn -B clean package --no-transfer-progress

      - name: Mostrar JAR generados
        if: always()
        shell: bash
        run: |
          echo "=== JAR GENERADOS ==="
          find Permadeath-master -type f -name '*.jar' -not -path '*/.git/*' | sort || true

      - name: Subir JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PermadeathCoreRebirth-JARs
          path: |
            Permadeath-master/**/target/*.jar
          if-no-files-found: error
