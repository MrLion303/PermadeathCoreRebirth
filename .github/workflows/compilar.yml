name: Compilar PermadeathCoreRebirth

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Detectar y compilar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar estructura
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== ROOT ==="
          ls -la
          echo "=== FILES ==="
          find . -maxdepth 5 -type f -not -path './.git/*' | sort
          echo "=== BUILD FILES ==="
          find . -type f -not -path './.git/*' \(
            -name 'build.gradle' -o -name 'build.gradle.kts' -o
            -name 'settings.gradle' -o -name 'settings.gradle.kts' -o
            -name 'gradle.properties' -o -name 'gradlew' -o
            -name 'gradlew.bat' -o -name 'pom.xml'
          \) -print

      - name: Detectar Java requerido
        shell: bash
        run: |
          if grep -RqsE 'JavaLanguageVersion|java.toolchain|sourceCompatibility|targetCompatibility'             --include='*.gradle' --include='*.gradle.kts' . 2>/dev/null; then
            echo "Configuración Java encontrada en Gradle."
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar con Gradle Wrapper
        if: hashFiles('gradlew') != ''
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Compilar con Gradle instalado
        if: hashFiles('gradlew') == '' && (hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != '')
        shell: bash
        run: |
          gradle build --stacktrace --no-daemon

      - name: Fallar si no hay proyecto Gradle
        if: hashFiles('gradlew') == '' && hashFiles('build.gradle') == '' && hashFiles('build.gradle.kts') == ''
        shell: bash
        run: |
          echo "::error::No se encontró Gradle Wrapper ni build.gradle/build.gradle.kts."
          exit 1

      - name: Mostrar JAR
        if: always()
        shell: bash
        run: |
          echo "=== JAR GENERADOS ==="
          find . -type f -path '*/build/libs/*.jar' -print || true

      - name: Subir JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PermadeathCoreRebirth
          path: '**/build/libs/*.jar'
          if-no-files-found: error
