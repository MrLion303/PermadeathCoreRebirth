name: Compilar PermadeathCoreRebirth

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar con Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Permadeath-master/pom.xml

      - name: Mostrar versiones
        run: |
          java -version
          mvn -version

      - name: Preparar Spigot 26.3
        working-directory: Permadeath-master
        shell: bash
        run: |
          set -euo pipefail

          echo "Comprobando si Spigot 26.3 ya está instalado..."
          if mvn -q dependency:get             -Dartifact=org.spigotmc:spigot:26.3-R0.1-SNAPSHOT             -Dtransitive=false; then
            echo "Spigot 26.3 ya está disponible."
            exit 0
          fi

          echo "Spigot 26.3 no está publicado en los repositorios Maven."
          echo "Construyendo Spigot 26.3 mediante BuildTools..."

          curl -fsSL             "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar"             -o BuildTools.jar

          java -jar BuildTools.jar --rev 26.3 --compile SPIGOT

          echo "Comprobando artefacto generado..."
          mvn -q dependency:get             -Dartifact=org.spigotmc:spigot:26.3-R0.1-SNAPSHOT             -Dtransitive=false

      - name: Compilar proyecto
        working-directory: Permadeath-master
        run: mvn -B clean package --no-transfer-progress

      - name: Preparar plugin final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="Permadeath-master/main/target/PermadeathCoreRebirth-1.3.jar"
          test -f "$JAR"
          cp "$JAR" "dist/PermadeathCoreRebirth.jar"
          echo "Plugin listo: dist/PermadeathCoreRebirth.jar"

      - name: Mostrar plugin generado
        if: always()
        shell: bash
        run: |
          echo "=== PLUGIN GENERADO ==="
          ls -lh dist/PermadeathCoreRebirth.jar 2>/dev/null || true

      - name: Exportar plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PermadeathCoreRebirth
          path: dist/PermadeathCoreRebirth.jar
          if-no-files-found: error
